<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet" />

  <body data-page="recipesPage" class="bg-[#faf9f6] font-['Be_Vietnam_Pro'] text-[15px] leading-[1.65] text-[#2f342d]">
    <header class="sticky top-0 z-10 flex h-[65px] items-center border-b border-[#e7e5df] bg-[#faf9f6]/92 backdrop-blur md:h-[78px]"><div class="relative mx-auto flex w-full max-w-[1180px] items-center justify-between px-[18px] md:px-[26px]">
        <a class="font-['Playfair_Display'] text-[24px] font-bold" href="index.html">Nhà bếp <span class="text-[#78966c]">của Lyn</span></a>
        <nav class="js-nav-links absolute top-[64px] left-0 right-0 hidden flex-col gap-3 border-b border-[#e7e5df] bg-[#faf9f6] p-5 text-[13px] font-semibold md:static md:flex md:flex-row md:gap-7 md:border-0 md:bg-transparent md:p-0">
          <a class="hover:text-[#78966c]" href="index.html">Trang chủ</a><a class="text-[#78966c]" href="recipes.html">Công thức</a
          ><a href="meal-prep.html">Meal prep</a><a href="articles.html">Góc sống khỏe</a
          ><a href="about.html">Về chúng mình</a>
        </nav>
        <button class="js-menu text-[22px] md:hidden">☰</button>
      </div>
    </header>
    <main class="mx-auto max-w-[1180px] px-[18px] md:px-[26px]">
      <section class="py-[48px] pb-[30px] text-center md:py-[74px] md:pb-[50px]">
        <p class="text-[11px] font-bold uppercase tracking-[.15em] text-[#78966c]">Công thức healthy</p>
        <h1 class="font-['Playfair_Display'] text-[clamp(42px,6vw,76px)] leading-[1.12]">Dễ làm, đủ đầy, ngon lành</h1>
        <p class="mx-auto my-[15px] max-w-[600px] text-[#74776f]">Những công thức vừa vặn với nhịp sống bận rộn của bạn.</p>
      </section>
      <div class="mb-8 flex flex-wrap items-center gap-3">
        <input id="search" class="min-w-[220px] flex-1 rounded border border-[#e7e5df] bg-white px-[15px] py-3" placeholder="Tìm tên món ăn..." /><select
          id="category"
          class="border border-[#e7e5df] bg-white p-3"
        >
          <option value="all">Tất cả bữa ăn</option>
          <option>Bữa sáng</option>
          <option>Bữa trưa</option>
          <option>Bữa tối</option>
          <option>Ăn nhẹ</option></select
        ><select id="sort" class="border border-[#e7e5df] bg-white p-3">
          <option value="default">Sắp xếp mặc định</option>
          <option value="time">Thời gian nhanh nhất</option>
          <option value="calories">Ít calories nhất</option></select
        ><span id="result-count" class="ml-auto text-[13px] text-[#74776f]"></span>
      </div>
      <div id="recipe-list" class="grid gap-[22px] md:grid-cols-3"></div>
    </main>
    <footer class="mt-[70px] border-t border-[#e7e5df] py-[42px] text-[13px] text-[#74776f]"><div class="mx-auto max-w-[1180px] px-[18px] md:px-[26px]">© 2026 Nhà bếp của Lyn</div></footer>
    <script src="js/main.js"></script>
